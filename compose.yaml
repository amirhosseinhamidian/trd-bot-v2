services:
  postgres:
    image: postgres:17-alpine
    container_name: trd-bot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: trd_bot
      POSTGRES_USER: trd_bot
      POSTGRES_PASSWORD: trd_bot_dev_password

    ports:
      - '5432:5432'

    volumes:
      - trd_bot_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U trd_bot -d trd_bot
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  trd_bot_postgres_data:
