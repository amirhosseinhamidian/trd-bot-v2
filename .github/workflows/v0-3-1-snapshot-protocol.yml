name: TRD Bot v0.3.1 snapshot protocol

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - '.github/workflows/v0-3-1-snapshot-protocol.yml'
      - 'artifacts/v0.3.1/trd-v031-02-snapshot-protocol-freeze.json'
      - 'alembic/versions/20261106_0037_nexora_snapshot_protocol.py'
      - 'contracts/integration/nexora/**'
      - 'contracts/trd-bot-v0.3.1-snapshot-protocol.json'
      - 'docs/v0.3.1/02-stable-snapshot-protocol.md'
      - 'scripts/verify_v0_3_1_snapshot_protocol.py'
      - 'src/trd_bot/db/**'
      - 'src/trd_bot/integration/nexora/**'
      - 'tests/**'
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v0-3-1-snapshot-protocol.yml'
      - 'artifacts/v0.3.1/trd-v031-02-snapshot-protocol-freeze.json'
      - 'alembic/versions/20261106_0037_nexora_snapshot_protocol.py'
      - 'contracts/integration/nexora/**'
      - 'contracts/trd-bot-v0.3.1-snapshot-protocol.json'
      - 'docs/v0.3.1/02-stable-snapshot-protocol.md'
      - 'scripts/verify_v0_3_1_snapshot_protocol.py'
      - 'src/trd_bot/db/**'
      - 'src/trd_bot/integration/nexora/**'
      - 'tests/**'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v031-snapshot-protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-protocol:
    name: v0.3.1 stable snapshot protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify stage contract and protocol boundary
        run: python scripts/verify_v0_3_1_snapshot_protocol.py
      - name: Run stage mutation tests
        run: python -m unittest tests/test_v0_3_1_snapshot_protocol.py -v
      - name: Run snapshot protocol and persistence tests
        run: python -m pytest tests/test_nexora_snapshot_protocol.py tests/test_nexora_snapshot_persistence.py -v
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run strict type checks
        run: python -m mypy
