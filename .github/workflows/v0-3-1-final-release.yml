name: TRD Bot v0.3.1 final release acceptance

on:
  push:
    branches:
      - feature/v0.3.1-nexora-integration
    paths:
      - '.env.example'
      - '.github/workflows/v0-3-1-final-release.yml'
      - '.github/workflows/v0-3-1-stage-acceptance.yml'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'artifacts/v0.3.1/trd-v031-11-release-basis.json'
      - 'contracts/trd-bot-v0.3.1-final-release.json'
      - 'contracts/v0.3.1/stage-acceptance/trd-v031-11.json'
      - 'docs/v0.3.1/11-final-acceptance-release-cut.md'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
      - 'pyproject.toml'
      - 'scripts/verify_v0_3_1_final_release.py'
      - 'src/trd_bot/__init__.py'
      - 'src/trd_bot/release_hardening.py'
      - 'tests/test_release_hardening.py'
      - 'tests/test_release_version.py'
      - 'tests/test_v0_3_1_final_release.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  acceptance:
    uses: ./.github/workflows/v0-3-1-stage-acceptance.yml
    with:
      stage_id: TRD-V031-11

  release_tag:
    name: Create immutable v0.3.1 tag
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/feature/v0.3.1-nexora-integration' }}
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create same-SHA release tag
        env:
          RELEASE_TAG: v0.3.1
        run: |
          existing="$(git ls-remote --tags --refs origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "${RELEASE_TAG} already targets ${existing}, not ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [ "$existing" = "$GITHUB_SHA" ]; then
            echo "${RELEASE_TAG} already targets accepted commit ${GITHUB_SHA}"
            exit 0
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${RELEASE_TAG}"
          test "$(git ls-remote --tags --refs origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')" = "$GITHUB_SHA"
