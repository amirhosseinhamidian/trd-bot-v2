name: TRD Bot v0.3.1 portfolio snapshot resources

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - '.github/workflows/v0-3-1-portfolio-snapshots.yml'
      - 'contracts/integration/nexora/**'
      - 'contracts/trd-bot-v0.3.1-portfolio-snapshot-resources.json'
      - 'docs/v0.3.1/03-portfolio-snapshot-resources.md'
      - 'scripts/verify_v0_3_1_portfolio_snapshot_resources.py'
      - 'src/trd_bot/integration/nexora/**'
      - 'tests/test_nexora_integration_capabilities.py'
      - 'tests/test_nexora_portfolio_snapshots.py'
      - 'tests/test_v0_3_1_portfolio_snapshot_resources.py'
      - 'tests/test_release_hardening.py'
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v0-3-1-portfolio-snapshots.yml'
      - 'contracts/integration/nexora/**'
      - 'contracts/trd-bot-v0.3.1-portfolio-snapshot-resources.json'
      - 'docs/v0.3.1/03-portfolio-snapshot-resources.md'
      - 'scripts/verify_v0_3_1_portfolio_snapshot_resources.py'
      - 'src/trd_bot/integration/nexora/**'
      - 'tests/test_nexora_integration_capabilities.py'
      - 'tests/test_nexora_portfolio_snapshots.py'
      - 'tests/test_v0_3_1_portfolio_snapshot_resources.py'
      - 'tests/test_release_hardening.py'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v031-portfolio-snapshots-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-snapshots:
    name: v0.3.1 portfolio snapshot resources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify stage contract and portfolio resource boundary
        run: python scripts/verify_v0_3_1_portfolio_snapshot_resources.py
      - name: Run stage mutation tests
        run: python -m unittest tests/test_v0_3_1_portfolio_snapshot_resources.py -v
      - name: Run authenticated portfolio snapshot tests
        run: |
          python -m pytest \
            tests/test_nexora_portfolio_snapshots.py \
            tests/test_nexora_integration_capabilities.py \
            tests/test_nexora_snapshot_protocol.py \
            tests/test_nexora_snapshot_persistence.py \
            -v
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run strict type checks
        run: python -m mypy
