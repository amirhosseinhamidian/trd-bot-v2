name: TRD Bot v0.3.1 integration roadmap

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - '.github/workflows/v0-3-1-integration-roadmap.yml'
      - 'contracts/integration/nexora/**'
      - 'contracts/trd-bot-v0.3.1-nexora-integration-roadmap.json'
      - 'docs/v0.3.1/**'
      - 'scripts/verify_v0_3_1_integration_roadmap.py'
      - 'tests/test_v0_3_1_integration_roadmap.py'
      - 'README.md'
      - 'pyproject.toml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v0-3-1-integration-roadmap.yml'
      - 'contracts/integration/nexora/**'
      - 'contracts/trd-bot-v0.3.1-nexora-integration-roadmap.json'
      - 'docs/v0.3.1/**'
      - 'scripts/verify_v0_3_1_integration_roadmap.py'
      - 'tests/test_v0_3_1_integration_roadmap.py'
      - 'README.md'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v031-roadmap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-roadmap-contract:
    name: v0.3.1 integration roadmap contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen Nexora contract and delivery roadmap
        run: python scripts/verify_v0_3_1_integration_roadmap.py

      - name: Run roadmap mutation tests
        run: python -m unittest tests/test_v0_3_1_integration_roadmap.py -v
