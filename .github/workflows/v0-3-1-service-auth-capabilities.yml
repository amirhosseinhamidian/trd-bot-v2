name: TRD Bot v0.3.1 service auth and capabilities

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - '.github/workflows/v0-3-1-service-auth-capabilities.yml'
      - '.env.example'
      - 'contracts/integration/nexora/**'
      - 'contracts/trd-bot-v0.3.1-service-auth-capabilities.json'
      - 'docs/v0.3.1/01-service-authentication-capabilities.md'
      - 'scripts/verify_v0_3_1_service_auth_capabilities.py'
      - 'src/trd_bot/core/config.py'
      - 'src/trd_bot/integration/nexora/**'
      - 'src/trd_bot/main.py'
      - 'tests/test_nexora_integration_capabilities.py'
      - 'tests/test_release_hardening.py'
      - 'tests/test_v0_3_1_service_auth_capabilities.py'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v0-3-1-service-auth-capabilities.yml'
      - '.env.example'
      - 'contracts/integration/nexora/**'
      - 'contracts/trd-bot-v0.3.1-service-auth-capabilities.json'
      - 'docs/v0.3.1/01-service-authentication-capabilities.md'
      - 'scripts/verify_v0_3_1_service_auth_capabilities.py'
      - 'src/trd_bot/core/config.py'
      - 'src/trd_bot/integration/nexora/**'
      - 'src/trd_bot/main.py'
      - 'tests/test_nexora_integration_capabilities.py'
      - 'tests/test_release_hardening.py'
      - 'tests/test_v0_3_1_service_auth_capabilities.py'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v031-service-auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-auth-capabilities:
    name: v0.3.1 service auth and capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify stage contract and security boundary
        run: python scripts/verify_v0_3_1_service_auth_capabilities.py

      - name: Run stage mutation tests
        run: python -m unittest tests/test_v0_3_1_service_auth_capabilities.py -v

      - name: Run authenticated capability endpoint tests
        run: python -m pytest tests/test_nexora_integration_capabilities.py -v

      - name: Check stage formatting
        run: |
          python -m ruff format --check \
            scripts/verify_v0_3_1_service_auth_capabilities.py \
            src/trd_bot/integration/nexora \
            tests/test_nexora_integration_capabilities.py \
            tests/test_v0_3_1_service_auth_capabilities.py

      - name: Run stage Ruff checks
        run: |
          python -m ruff check \
            scripts/verify_v0_3_1_service_auth_capabilities.py \
            src/trd_bot/integration/nexora \
            tests/test_nexora_integration_capabilities.py \
            tests/test_v0_3_1_service_auth_capabilities.py

      - name: Run strict type checks
        run: python -m mypy
