[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trd-bot-v2"
version = "0.1.0"
description = "Research, backtesting, paper portfolio, and position monitoring platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1,<1.20",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0.52,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff==0.16.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests requiring external services such as PostgreSQL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
