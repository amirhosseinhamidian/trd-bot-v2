name: TRD Bot v0.3.1 reusable stage acceptance

on:
  workflow_call:
    inputs:
      stage_id:
        description: Exact TRD-V031 stage ID defined by the acceptance policy
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: v031-stage-acceptance-${{ inputs.stage_id }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerequisite:
    name: Previous stage acceptance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify previous stage evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_v0_3_1_acceptance_evidence.py \
            --stage-id "${{ inputs.stage_id }}" \
            --repository "${{ github.repository }}" \
            --output previous-acceptance-evidence.json

  stage_contract:
    name: Stage contract and focused acceptance
    needs: prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run stage contract and focused tests
        run: python scripts/run_v0_3_1_stage_gate.py --stage-id "${{ inputs.stage_id }}"

  backend:
    name: Backend quality and unit tests
    needs: prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run strict type checks
        run: python -m mypy
      - name: Run backend unit tests
        run: python -m pytest -m "not integration"

  postgresql:
    name: PostgreSQL migration and integration acceptance
    needs: prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trd_bot_test
          POSTGRES_USER: trd_bot
          POSTGRES_PASSWORD: trd_bot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trd_bot -d trd_bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRD_BOT_ENVIRONMENT: test
      TRD_BOT_DEBUG: 'false'
      TRD_BOT_DATABASE_URL: postgresql+psycopg://trd_bot:trd_bot_test_password@127.0.0.1:5432/trd_bot_test
      TRD_BOT_TEST_DATABASE_URL: postgresql+psycopg://trd_bot:trd_bot_test_password@127.0.0.1:5432/trd_bot_test
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fresh install migration
        run: python -m alembic upgrade head
      - name: Downgrade to base
        run: python -m alembic downgrade base
      - name: Upgrade path migration
        run: python -m alembic upgrade head
      - name: Check pending migrations
        run: python -m alembic check
      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration -v

  frontend:
    name: Frontend quality, tests, and production build
    needs: prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  security:
    name: Nexora security boundary
    needs: prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run security and deterministic boundary tests
        run: |
          python -m pytest \
            tests/test_release_hardening.py \
            tests/test_nexora_integration_capabilities.py \
            tests/test_nexora_snapshot_protocol.py \
            tests/test_nexora_snapshot_persistence.py \
            -v

  evidence:
    name: Generate same-SHA acceptance evidence
    if: ${{ always() && !cancelled() }}
    needs:
      - prerequisite
      - stage_contract
      - backend
      - postgresql
      - frontend
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve tested tree
        id: git
        run: echo "tree_sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Generate versioned acceptance evidence
        run: |
          python scripts/generate_v0_3_1_acceptance_evidence.py \
            --stage-id "${{ inputs.stage_id }}" \
            --repository "${{ github.repository }}" \
            --commit-sha "${{ github.sha }}" \
            --tree-sha "${{ steps.git.outputs.tree_sha }}" \
            --ref "${{ github.ref }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --event "${{ github.event_name }}" \
            --gate "prerequisite=${{ needs.prerequisite.result }}" \
            --gate "stage_contract=${{ needs.stage_contract.result }}" \
            --gate "backend=${{ needs.backend.result }}" \
            --gate "postgresql=${{ needs.postgresql.result }}" \
            --gate "frontend=${{ needs.frontend.result }}" \
            --gate "security=${{ needs.security.result }}" \
            --output acceptance-evidence.json
      - name: Upload auditable acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.stage_id }}-acceptance-${{ github.sha }}
          path: acceptance-evidence.json
          if-no-files-found: error
          retention-days: 90
